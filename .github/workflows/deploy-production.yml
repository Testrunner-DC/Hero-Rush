name: 一键发布正式服 V2

run-name: 发布 ${{ inputs.revision }} 到 hero-v2.grand-umi.com

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 要发布的分支、标签或提交；通常保持 main
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: hero-rush-v2-production
  cancel-in-progress: false

jobs:
  verify:
    name: 测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: 检出待发布版本
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1

      - name: 确认发布提交
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 运行完整测试
        run: npm test

      - name: 检查 TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: 检查 V2 发布门禁
        run: |
          node scripts/report_v2_rule_coverage.mjs --strict
          node scripts/check_v2_switch_gate.mjs
          node scripts/report_v2_card_coverage.mjs --strict

      - name: 构建前端和服务端
        run: |
          npm run build
          npm run build --prefix server

  deploy:
    name: 原子发布
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hero-v2.grand-umi.com/battle
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - name: 检查部署配置
        shell: bash
        run: |
          for name in PROD_HOST PROD_USER PROD_SSH_KEY PROD_SSH_KNOWN_HOSTS RELEASE_SHA; do
            if [[ -z "${!name:-}" ]]; then
              echo "缺少部署配置：${name}" >&2
              exit 1
            fi
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: 配置专用 SSH 凭据
        shell: bash
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/hero_rush_deploy"
          chmod 0600 "$HOME/.ssh/hero_rush_deploy"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: 发布并执行自动健康检查
        shell: bash
        run: |
          ssh \
            -i "$HOME/.ssh/hero_rush_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "/usr/local/sbin/hero-rush-v2-deploy '${RELEASE_SHA}'"

      - name: 写入发布摘要
        shell: bash
        run: |
          {
            echo "### 正式服发布成功"
            echo ""
            echo "- 提交：\`${RELEASE_SHA}\`"
            echo "- 地址：https://hero-v2.grand-umi.com/battle"
            echo "- HTTPS、服务状态与双客户端 WSS 握手均已通过服务器端检查。"
          } >> "$GITHUB_STEP_SUMMARY"
